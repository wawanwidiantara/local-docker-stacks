services:
  postgres-db:
    build:
      context: .
      dockerfile: Dockerfile
    image: postgres-postgis-pgvector:18-3.6
    container_name: postgres-container
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-18:/var/lib/postgresql
      - ./initdb/20-extensions.sh:/docker-entrypoint-initdb.d/20-extensions.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-dev

volumes:
  postgres-data-18:
    driver: local

networks:
  local-dev:
    external: true
    name: local-dev-network
